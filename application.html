<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Online Application | Rwenkobwa Secondary School</title>
<style>
*{box-sizing:border-box}body{font-family:Arial;margin:0;background:#f4f7fb;line-height:1.6}
header{background:green;color:white;text-align:center;padding:20px}header h1{font-family:Algerian,Georgia,serif}
nav{background:#022b52;position:sticky;top:0}.nav{display:flex;justify-content:center;flex-wrap:wrap}
nav a{color:white;text-decoration:none;padding:11px 8px;font-weight:bold}nav a:hover{background:#0b72b9}
section{padding:50px 5%}.container{max-width:850px;margin:auto}
h2{text-align:center;color:#063970;margin-bottom:30px}
.form{background:white;padding:30px;border-radius:12px;box-shadow:0 3px 15px #0002}
label{display:block;font-weight:bold;margin-top:15px}
input,select,textarea{width:100%;padding:12px;margin-top:6px;border:1px solid #ccc;border-radius:6px;font-size:16px}
textarea{height:130px}
button{margin-top:20px;padding:13px 25px;background:#063970;color:white;border:0;border-radius:6px;font-weight:bold;cursor:pointer}
button:hover{background:#0b72b9}
footer{background:green;color:white;text-align:center;padding:35px}
@media(max-width:700px){nav a{font-size:12px;padding:8px 5px}.form{padding:20px}}
/* School badge watermark */
body::before {
    content: "";
    position: fixed;
    top: 50%;
    left: 50%;
    width: 200%;
    height: 200%;
    background-image: url("images/badge.jpg");
    background-size: contain;
    background-repeat: no-repeat;
    background-position: center;
    transform: translate(-50%, -50%);
    opacity: 0.08;
    z-index: -1;
    pointer-events: none;
}
</style>
</head>
<body>

<header><h1>RWENKOBWA SECONDARY SCHOOL</h1><p>Online Application</p></header>

<nav><div class="nav">
<a href="index.html">Home</a><a href="about.html">About</a><a href="academics.html">Academics</a><a href="fees.html">Fees</a>
<a href="sports.html">Sports</a><a href="activities.html">Activities</a><a href="gallery.html">Gallery</a><a href="staff.html">Staff</a>
<a href="facilities.html">Facilities</a><a href="curriculum.html">Curriculum</a><a href="application.html">Apply</a><a href="contact.html">Contact</a>
</div></nav>

<section>
<div class="container">

<h2>Apply Online</h2>

<div class="form">

<form action="https://formspree.io/f/meaojeqr" method="POST">
<!-- your student information -->

<!-- your class information -->

<label>Student Name</label>
<input type="text" name="student_name" placeholder="student name" required>

<label>Date of Birth</label>
<input type="date" name="date_of_birth" required>

<label>Gender</label>
<select name="gender" required>
<option value="">Select Gender</option>
<option value="Male">Male</option>
<option value="Female">Female</option>
</select>

<label>Class Applying For</label>
<select name="class_applying_for" required>
<option value="">Select Class</option>
<option>S.1</option>
<option>S.2</option>
<option>S.3</option>
<option>S.4</option>
<option>S.5</option>
<option>S.6</option>
</select>

<label>Parent/Guardian Name</label>
<input type="text" name="parent_guardian_name" required placeholder="Parent or guardian name">

<label>Telephone Number</label>
<input type="tel" name="telephone_number" required placeholder="07XXXXXXXX">

<label>Email Address</label>
<input type="email" name="email_address" placeholder="example@email.com">

<label>Previous School</label>
<input type="text" name="previous_school" placeholder="Previous school">

<label>Additional Information</label>
<textarea name="additional_information" placeholder="Write additional information including your performance from previous school"></textarea>

<button type="submit">SUBMIT APPLICATION</button>

</form>

</div>
</div>
</section>

<script>
function submitForm(event){
event.preventDefault();
alert("Thank you. Your application has been submitted successfully.");
}
</script>

<footer>&copy; 2026 Rwenkobwa Secondary School</footer>
</body>
</html>
