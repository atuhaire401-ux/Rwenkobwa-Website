        *{box-sizing:border-box}body{font-family:Arial;margin:0;background:#f4f7fb}
     header{background:green;color:white;text-align:center;padding:20px}header h1{font-family:Algerian,Georgia,serif}
   nav{background:#022b52;position:sticky;top:0}.nav{display:flex;justify-content:center;flex-wrap:wrap}
  nav a{color:white;text-decoration:none;padding:11px 8px;font-weight:bold}nav a:hover{background:#0b72b9}
 section{padding:50px 5%}.container{max-width:1200px;margin:auto}
h2{text-align:center;color:#063970;margin-bottom:30px}
 .gallery{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:18px}
  .gallery img{width:100%;height:220px;object-fit:cover;border-radius:10px;cursor:pointer;transition:.3s}
.gallery img:hover{transform:scale(1.03)}
.popup{display:none;position:fixed;inset:0;background:#000e;z-index:1000;align-items:center;justify-content:center}
.popup img{max-width:92%;max-height:90%}
.close{position:absolute;right:30px;top:5px;color:white;font-size:50px;cursor:pointer}
footer{background:green;color:white;text-align:center;padding:35px}
@media(max-width:500px){nav a{font-size:11px;padding:8px 5px}.gallery img{height:160px}}
.footer-photo {
    width: 90px;
    height: 90px;
    object-fit: cover;
    border-radius: 50%;
    border: 3px solid white;
    display: block;
    margin: 0 auto 10px;
}
