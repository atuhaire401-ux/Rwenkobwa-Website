<!DOCTYPE html>
<html>
<head>

<title>Gallery - Rwenkobwa Secondary School</title>

<style>

body {
    margin:0;
    font-family:Arial;
    background:#f4f7f6;
}

header {
    background:#075c3c;
    color:white;
    text-align:center;
    padding:20px;
}

header img {
    width:80px;
    height:80px;
    border-radius:50%;
}

nav {
    background:#043b27;
    text-align:center;
    padding:15px;
}

nav a {
    color:white;
    text-decoration:none;
    margin:8px;
    font-weight:bold;
}

h2 {
    text-align:center;
    color:#075c3c;
    padding:20px;
}

.gallery {
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:15px;
    padding:30px;
}

.gallery img {
    width:100%;
    height:220px;
    object-fit:cover;
    border-radius:10px;
}

.gallery img:hover {
    transform:scale(1.03);
}
.video-gallery {
    display: flex;
    flex-wrap: wrap;
    gap: 20px;
    justify-content: center;
}

.video-box {
    text-align: center;
    border: 1px solid #ccc;
    padding: 10px;
    background: white;
}

.video-box video {
    width: 300px;
    height: 200px;
    object-fit: cover;
}

footer {
    background:#043b27;
    color:white;
    text-align:center;
    padding:25px;
}

</style>
</head>
