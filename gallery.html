<!DOCTYPE html>

<meta charset="UTF-8">

<title>Gallery - Rwenkobwa Secondary School</title>

<style>

body {
    margin:0;
    font-family:Arial;
    background:#f4f7f6;
}

header {
    background:#075c3c;
    color:white;
    text-align:center;
    padding:20px;
}

header img {
    width:80px;
    height:80px;
    border-radius:50%;
}

nav {
    background:#043b27;
    text-align:center;
    padding:15px;
}

nav a {
    color:white;
    text-decoration:none;
    margin:8px;
    font-weight:bold;
}

h2 {
    text-align:center;
    color:#075c3c;
    padding:20px;
}

.gallery {
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:15px;
    padding:30px;
}

.gallery img {
    width:100%;
    height:220px;
    object-fit:cover;
    border-radius:10px;
}

.gallery img:hover {
    transform:scale(1.03);
}
.video-gallery {
    display: flex;
    flex-wrap: wrap;
    gap: 20px;
    justify-content: center;
}

.video-box {
    text-align: center;
    border: 1px solid #ccc;
    padding: 10px;
    background: white;
}

.video-box video {
    width: 300px;
    height: 200px;
    object-fit: cover;
}

footer {
    background:#043b27;
    color:white;
    text-align:center;
    padding:25px;
}
/* Make the website fit on smartphones */
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    width: 100%;
    font-family: Arial, sans-serif;
}

img {
    max-width: 100%;
    height: auto;
}

.container {
    width: 90%;
    max-width: 1200px;
    margin: auto;
}

/* Navigation */
nav {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 10px;
}

nav a {
    padding: 10px;
}

/* Smartphone screen */
@media screen and (max-width: 600px) {

    h1 {
        font-size: 28px;
    }

    h2 {
        font-size: 22px;
    }

    p {
        font-size: 16px;
        line-height: 1.6;
    }

    nav {
        flex-direction: column;
        width: 100%;
    }

    nav a {
        width: 100%;
        text-align: center;
    }

    .container {
        width: 94%;
    }

    img {
        width: 100%;
        height: auto;
    }
}
.gallery img {
    cursor: pointer;
    max-width: 100%;
    height: auto;
}

.popup {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.9);
    justify-content: center;
    align-items: center;
}

.popup img {
    max-width: 90%;
    max-height: 85%;
}

.close {
    position: absolute;
    top: 20px;
    right: 30px;
    color: white;
    font-size: 40px;
    cursor: pointer;
}

</style>
</head>
